site_name: WFX Documentation
site_description: Explicit, low-level C++ web framework
copyright: Copyright &copy; 2025-2026 Altered-commits

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.tabs.link

extra_css:
  - css/index.css
  - css/scrollbar_format.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting_started/installation.md
    - First Program: getting_started/first_program.md
  - Core Concepts:
    - Project Structure: core_concepts/project_structure.md
    - Engine Commands: core_concepts/engine_commands.md
    - WFX Settings: core_concepts/wfx_toml.md
  - API Reference:
    - Overview: api_reference/overview.md
    - Request & Response: api_reference/request_and_response.md
    - Routing: api_reference/routing.md
    - Middleware: api_reference/middleware.md
    - Constructor: api_reference/constructor.md
    - Async: api_reference/async.md
    - Templates: api_reference/templates.md
    - Forms: api_reference/forms.md
    - Json: api_reference/json.md
    - Telemetry: api_reference/telemetry.md
    - Memory: api_reference/memory.md
    - Environment: api_reference/env.md
    - Utils:
      - Crypto & Hash: api_reference/utils/crypto.md
      - Encoding: api_reference/utils/encoding.md
      - JWK: api_reference/utils/jwk.md
    - Endpoint:
      - Overview: api_reference/endpoint/overview.md
      - HTTP: api_reference/endpoint/http.md
      - SMTP: api_reference/endpoint/smtp.md
  - Developer Reference:
    - Overview: dev_reference/overview.md
    - Architecture: dev_reference/architecture.md
    - Codebase Architecture: dev_reference/codebase_architecture.md
    - Globals & Singletons: dev_reference/globals_and_singletons.md
    - ABI Layer: dev_reference/abi_layer.md
    - Build Macros: dev_reference/build_macros.md
    - Metrics & Observability: dev_reference/metrics_and_observability.md
    - Testing: dev_reference/testing.md