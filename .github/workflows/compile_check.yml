name: WFX Compile Check

# Reusable: invoked by the top-level orchestrator (ci.yml) AFTER the format check,-
# -so this file owns ONLY the build logic
on:
  workflow_call:

jobs:
  build:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang ninja-build

    # Save the entire build directory cuz i cannot waste github run 'time', i'm poor
    - name: Restore build/ cache
      uses: actions/cache@v3
      with:
        path: build
        key: build-${{ matrix.compiler }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          build-${{ matrix.compiler }}-

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build
