name: WFX Compile Check

# Reusable: invoked by entry.yml AFTER the format check, so this file owns
# ONLY the build logic
on:
  workflow_call:

jobs:
  build:
    name: Linux ${{ matrix.arch }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            arch: x86_64
            runs-on: ubuntu-latest
          - compiler: clang
            cc: clang
            cxx: clang++
            arch: x86_64
            runs-on: ubuntu-latest
          - compiler: gcc
            cc: gcc
            cxx: g++
            arch: arm64
            runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # full history needed to restore mtimes below

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang lld ninja-build

    # actions/checkout resets every file's mtime to checkout time, which beats
    # Ninja's mtime-based staleness check against the cached build/ dir below
    # (sources always look newer than cached objects -> full rebuild every run,
    # cache hit or not). Reset mtimes to last-commit time so only actually
    # changed files look new again.
    - name: Restore file mtimes from git history
      run: |
        git ls-files -z | while IFS= read -r -d '' f; do
          touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
        done

    # Save the entire build directory cuz i cannot waste github run 'time', i'm poor
    - name: Restore build/ cache
      uses: actions/cache@v6
      with:
        path: build
        key: build-${{ matrix.arch }}-${{ matrix.compiler }}-asan-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          build-${{ matrix.arch }}-${{ matrix.compiler }}-asan-

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_BUILD_TYPE=Debug \
          -DWFX_ENABLE_ASAN=ON

    - name: Build
      run: cmake --build build

    # Hands the wfx binary to audit_check.yml so it never has to compile. Only the
    # binary, include/ and shared/ are tracked source already in its checkout.
    - name: Upload wfx binary for the audit stage
      if: matrix.compiler == 'gcc' && matrix.arch == 'x86_64'
      uses: actions/upload-artifact@v7
      with:
        name: wfx-binary
        path: wfx
        retention-days: 1
