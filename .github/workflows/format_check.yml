name: WFX Format Check

# Reusable: invoked by the top-level orchestrator (ci.yml) AFTER the CI filter,-
# -so this file owns ONLY the formatting logic
on:
  workflow_call:

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: bash scripts/format.sh --dry-run
