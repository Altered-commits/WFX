name: WFX Format Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  ci_filter:
    uses: ./.github/workflows/ci_filter.yml

  # ---------------------------------------------------------------
  # Format check
  # ---------------------------------------------------------------
  format:
    name: Format Check
    needs: ci_filter
    if: needs.ci_filter.outputs.should_run == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: bash scripts/format.sh --dry-run

  # ---------------------------------------------------------------
  # Collector
  # ---------------------------------------------------------------
  ci-success:
    name: WFX Format Check Success
    runs-on: ubuntu-latest
    if: always()
    needs: [format, ci_filter]
    steps:
      - name: Check Status
        run: |
          if [[ "${{ needs.ci_filter.outputs.should_run }}" == "0" ]]; then
            echo "Format check skipped by filter. Marking as success."
            exit 0
          fi

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Format check failed."
            exit 1
          fi

          echo "Format check passed!"