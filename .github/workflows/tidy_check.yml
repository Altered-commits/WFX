name: WFX Tidy Check

# Reusable: invoked by entry.yml AFTER the compile check, so this file owns-
# -ONLY the clang-tidy logic. Reuses compile_check.yml's clang build cache-
# -so nothing gets rebuilt from scratch
on:
  workflow_call:

jobs:
  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed to restore mtimes below

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang clang-tidy ninja-build

      # See compile_check.yml: checkout resets mtimes, which defeats Ninja's-
      # -cache-hit detection on the restored build/ dir below.
      - name: Restore file mtimes from git history
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
          done

      - name: Restore build/ cache
        uses: actions/cache@v6
        with:
          path: build
          key: build-clang-asan-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: |
            build-clang-asan-

      # Same flags as compile_check.yml's clang leg, cache hit means no-op
      - name: Ensure compile database is up to date
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # scripts/tidy_cache.py skips re-analyzing files unchanged since a prior-
      # -run (see the script's docstring for how it keys results). This is what-
      # -actually persists across CI runs, so restore/save it same as build/
      - name: Restore clang-tidy result cache
        uses: actions/cache@v6
        with:
          path: ~/.wfx/tidy_cache
          key: tidy-cache-${{ github.run_id }}
          restore-keys: |
            tidy-cache-

      - name: Run clang-tidy
        run: bash scripts/tidy.sh --ci
